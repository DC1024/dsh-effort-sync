# The offline rehearsal is the whole test suite: a fake ctx + fake provider,
# no live config, no credentials, no network to any real endpoint.
name: rehearsal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the offline rehearsal
        run: node rehearsal.mjs
